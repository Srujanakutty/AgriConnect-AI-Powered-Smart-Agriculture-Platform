<!DOCTYPE html>
<html>

<head>
<title>Marketplace</title>

<style>

body{

margin:0;

font-family:Arial;

background:url("https://images.unsplash.com/photo-1464226184884-fa280b87c399") no-repeat center center fixed;

background-size:cover;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.container{

background:rgba(0,0,0,0.7);

padding:60px;

border-radius:15px;

text-align:center;

color:white;

width:600px;

}

h1{

font-size:42px;

margin-bottom:40px;

}

.buttons{

display:flex;

justify-content:center;

gap:40px;

}

button{

padding:18px 40px;

font-size:18px;

border:none;

border-radius:8px;

cursor:pointer;

}

.farmer{

background:#28a745;
color:white;

}

.consumer{

background:#007bff;
color:white;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="container">

<h1>AgriConnect Marketplace</h1>

<div class="buttons">

<a href="/farmer">

<button class="farmer">I am Farmer</button>

</a>

<a href="/consumer">

<button class="consumer">I am Consumer</button>

</a>

</div>

</div>

</body>

</html>
