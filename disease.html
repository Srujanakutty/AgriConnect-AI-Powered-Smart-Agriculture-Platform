<!DOCTYPE html>
<html>

<head>

<title>Disease Detection</title>

<style>

body{

margin:0;
font-family:Arial, sans-serif;

background-image:url("https://images.unsplash.com/photo-1523741543316-beb7fc7023d8");

background-size:cover;
background-position:center;
background-attachment:fixed;

height:100vh;

display:flex;
align-items:center;
justify-content:center;

color:white;

}

.overlay{

background:rgba(0,0,0,0.65);

padding:50px;

border-radius:12px;

text-align:center;

width:520px;

box-shadow:0 0 20px rgba(0,0,0,0.5);

}

h1{

font-size:36px;

margin-bottom:25px;

}

input{

margin-top:15px;

}

button{

margin-top:25px;

padding:12px 28px;

font-size:16px;

border:none;

border-radius:6px;

background:#2e7d32;

color:white;

cursor:pointer;

}

button:hover{

background:#1b5e20;

}

.home{

display:block;

margin-top:25px;

color:#ddd;

text-decoration:none;

}

.home:hover{

color:white;

}

</style>

</head>

<body>

<div class="overlay">

<h1>Crop Disease Detection</h1>

<form action="/disease" method="POST" enctype="multipart/form-data">

<input type="file" name="image" required>

<br>

<button type="submit">Predict Disease</button>

</form>

<a href="/" class="home">Return to Home Page</a>

</div>

</body>

</html>
