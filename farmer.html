<!DOCTYPE html>
<html>

<head>
<title>Farmer Sell Crops</title>

<style>

body{

margin:0;

font-family:Arial;

background:url("https://images.unsplash.com/photo-1500595046743-cd271d694d30") no-repeat center center fixed;

background-size:cover;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}

.container{

background:rgba(0,0,0,0.7);

padding:40px;

border-radius:12px;

text-align:center;

color:white;

width:450px;

}

h1{
font-size:32px;
}

input{

padding:10px;

margin:8px;

width:90%;

}

button{

padding:12px 25px;

background:#28a745;

border:none;

color:white;

font-size:16px;

border-radius:6px;

cursor:pointer;

}

.success{

color:lightgreen;
font-size:18px;
margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h1>Sell Your Crop</h1>

<form method="POST">

<input name="crop" placeholder="Crop Name" required>

<input name="price" placeholder="Price per kg" required>

<input name="quantity" placeholder="Quantity" required>

<input name="farmer_name" placeholder="Farmer Name" required>

<input name="contact" placeholder="Contact Number" required>

<input name="location" placeholder="Location" required>

<br>

<button type="submit">Submit Crop</button>

</form>

{% if success %}

<p class="success">Product submitted successfully!</p>

{% endif %}

</div>

</body>

</html>
